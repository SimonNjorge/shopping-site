<!DOCTYPE html>
<html>
  <head>
    <title>shopping site</title>

    <!-- This code is needed for responsive design to work.
      (Responsive design = make the website look good on
      smaller screen sizes like a phone or a tablet). -->
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Load a font called Roboto from Google Fonts. -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">

    <!-- Here are the CSS files for this page. -->
    <link rel="stylesheet" href="styles/shared/general.css">
    <link rel="stylesheet" href="styles/shared/amazon-header.css">
    <link rel="stylesheet" href="styles/pages/amazon.css">

    <link rel="stylesheet" href="styles/pages/products-showcase.css">
  </head>
  <body>
    <div class="amazon-header">
      <div class="amazon-header-left-section">
        <div class="large-site-logo">
          <a href="index.html" class="header-link">
            <span class="Shopping-text">
              Shopping 
            </span>
            <span class="site-text">
              site
            </span>
          </a>
        </div>
        <div class="small-site-logo">
          <a href="index.html" class="header-link">
            <span class="site-text">site</span>
            <span class="logo-text">logo</span>
          </a>
        </div>
      </div>

      <div class="amazon-header-middle-section">
        <input class="search-bar js-search-bar" type="text" placeholder="Search product">

        <button class="search-button js-search-btn">
          <img class="search-icon" src="images/icons/search-icon.png">
        </button>
      </div>

      <div class="amazon-header-right-section">
        <div class="returns-orders-sec">
          <a class="orders-link o header-link" href="orders.html">
          <span class="returns-text">Returns</span>
          <span class="orders-text">& Orders</span>
          </a>
        </div>
       <div class="cart-sec">
          <a class="cart-link header-link" href="checkout.html">
            <div>
              <img class="cart-icon" src="images/icons/cart-icon.png">
              <div class="cart-quantity js-cart-quantity"></div>
            </div>
            
            <div class="cart-text">Cart</div>
          </a>
       </div>
      </div>
    </div>
    
    <div class="main">
      <div class="product-showcase-slider next">
        <div class="slider other_1" style="background-color: rgb(174, 188, 186);">
          <div class="description-cont">
            <div class="slider-description">Grab amazing toys for your little munchkins</div>
          </div>
          <div class="slider-img-cont">
            <img src="images/toys for little ones amazon.jpg" alt="toys img">
          </div>
          <a href="#">
            explore more on toys
          </a>
        </div>  
        
        <div class="slider active" style="background-color: rgb(255,215,0); color: rgb(56, 41, 41);">
          <div class="description-cont">
            <p class="slider-description">Look smarter with our fashion collections</p>
          </div>
          <div class="slider-img-cont">
            <img src="images/shopfashionamazon.jpg" alt="fashion img">
          </div>
          <a href="#">
            Discover more on fashion
          </a>
        </div>

        <div class="slider other_2" style="background-color: rgb(255,182,193);">
          <div class="description-cont">
            <p class="slider-description">Shop kitchen essentials</p>
          </div>
          <div class="slider-img-cont">
            <img src="images/kitchenessentialsamazon.jpg" alt="kitchen essentials img">
          </div>
          <a href="#">
            explore more on  kitchen utilities
          </a>
        </div>

        <button class="prev-btn">
          <
        </button>
        <button class="next-btn">
          >
        </button>
      </div>
      <div class="products-grid js-products-grid">
      </div>
    </div>
    <script type="module" src="scripts/amazon.js"></script>
    <script type="module" src="data/products.js"></script>
    <script src="scripts/slider.js"></script>
  </body>
</html>
